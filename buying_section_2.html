<!DOCTYPE html>
<html lang="es">
<head>
    <title>AVICII FOREVER: THE TRIBUTE</title>
    <meta charset="UTF-8">

    <link href="css/styles.css" rel="stylesheet" type="text/css">

    <link href="img/Favicon Avicii Oscuro.png" rel="icon" type="image/png">

    <!-- Para iconos -->
    <script
      src="https://kit.fontawesome.com/c3fd22b8e3.js"
      crossorigin="anonymous"
    ></script>

    <!-- Tipografía Lato de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">

    <!-- Librería para animaciones -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script src="js/script.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AVICII FOREVER: THE TRIBUTE</title>
</head>
<body>
    <header id="menu">

      <div id="logo-menu">
        <img src="img/Avicii 4ever Blanco Menú.png" alt="Logo Avicii Forever">
      </div>

      <nav id="nav-menu">
        <div>
          <i class="fas fa-bars" onclick="openMenu()"></i>
          <ul>
            <li>
              <a class="link" href="index.html" onclick="closeMenu()">FESTIVAL</a>
            </li>
            <li>
              <a class="link" href="gallery.html" onclick="closeMenu()">GALLERY</a>
            </li>
            <li>
              <a class="current_page" href="tickets.html" onclick="closeMenu()">TICKETS</a>
            </li>
            <li>
              <i class="fa-solid fa-xmark" onclick="closeMenu()"></i>
            </li>
          </ul>
        </div>
      </nav>
    </header>
    <section id="only-section" onscroll="changeOpacity()">
      <div id="inicio" class="info">
        <h1 class="tipo1" >LEGACY</h1>
        <h1 class="tipo2" >PASS</h1>
      </div>
      <div id="contenedor-buying" class="info" data-aos="fade-up">
        <div id="pass">
            <i id="ticket-icon" class="fa-solid fa-ticket" style="color: #ffffff;"></i>
            <h2>Legacy Pass</h2>
            <div class="ticket-price">
                <div id="less-tickets" onclick="changeNumber(-1)">-</div>
                <div id="number-of-tickets">0</div>
                <div id="more-tickets" onclick="changeNumber(1)">+</div>
            </div>
        </div>
        <div class="total-price">
            <h3>Total:  <span id="price"></span>$</h3>
        </div>
      </div>
      <div id="calendar" class="info" data-aos="fade-up">
        <h2>April 2026</h2>
        <div id="days">
           <table class="table-calendar">
              <thead id="days-writen">
                <td>Mon</td>
                <td>Tue</td>
                <td>Wed</td>
                <td>Thu</td>
                <td>Fri</td>
                <td>Sat</td>
                <td>Sun</td>
              </thead>
              <tbody id="days-number">
                <td>20</td>
                <td class="number">21</td>
                <td class="number">22</td>
                <td class="number">23</td>
                <td class="number">24</td>
                <td class="number">25</td>
                <td>26</td>
              </tbody>
           </table>
        </div>
      </div>
      <footer data-aos="fade-up">
        <figure id="logo-footer">
          <img src="img/Avicii 4ever Blanco Menú.png" alt="Logo Avicii Forever">
        </figure>
        <ul class="social-webs">
          <li>
            <a href="https://www.facebook.com/avicii">
              <i class="fab fa-facebook-f"></i>
            </a>
          </li>
          <li>
            <a href="https://x.com/avicii">
              <i class="fab fa-twitter"></i>
            </a>
          </li>
          <li>
            <a href="https://www.instagram.com/avicii">
              <i class="fab fa-instagram"></i>
            </a>
          </li>
          <li>
            <a href="https://www.youtube.com/user/AviciiOfficial">
              <i class="fab fa-youtube"></i>
            </a>
          </li>
          <li>
            <a href="https://open.spotify.com/artist/1vCWHaC5f2uS3yhpwWbIA6">
              <i class="fab fa-spotify"></i>
            </a>
          </li>
          <li>
            <a href="https://www.tiktok.com/@avicii">
              <i class="fab fa-tiktok"></i>
            </a>
          </li>
        </ul>
        <figure id="sponsors">
          <img src="img/sponsors_footer.png" alt="Sponsors">
        </figure>
      </footer>
    </section>
</body>
